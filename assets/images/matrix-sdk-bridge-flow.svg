<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Matrix SDK Bridge architecture</title>
  <desc id="desc">A JavaScript application calls a Rust WebAssembly bridge, which uses Matrix SDK and Matrix infrastructure.</desc>
  <rect width="960" height="330" rx="20" fill="#130c0d"/>
  <g font-family="system-ui,sans-serif">
    <text x="56" y="55" fill="#f7b6b9" font-size="18" font-weight="700" letter-spacing="2">MATRIX SDK BRIDGE ARCHITECTURE</text>
    <g fill="#211717" stroke="#544445" stroke-width="2">
      <rect x="55" y="120" width="190" height="108" rx="12"/>
      <rect x="385" y="120" width="190" height="108" rx="12"/>
      <rect x="715" y="120" width="190" height="108" rx="12"/>
    </g>
    <g fill="#f8e0e0" font-size="21" font-weight="700">
      <text x="91" y="165">JavaScript app</text>
